<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QueueSmart - Signup</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header>
    <h1>Queue<span class="smart">Smart</span></h1>

  </header>

  <main>
    <h2>Signup</h2>


<section>
  <h3>Make an account:</h3>
<form id="signupForm">
  <label for="semail">Email:</label><br>
  <input type="text" id="signemail" name="signemail"><br>
  <label for="spassword">Password:</label><br>
  <input type="password" id="spassword" name="spassword"><br>
  <label for="srpassword">Repeat Password:</label><br>
  <input type="password" id="srpassword" name="srpassword"><br><br>
  <input type="submit" id="signsubmit" value="Submit"> <br>
</form>
  <p>
  <span id="signError" class="error"></span><br>
  <br>Already have an account? <br>
  <a href="queue-login.html"> Login here</a>
  </p>
</section>

  </main>
<script src="accounts.js" defer></script>
</body>
</html>
