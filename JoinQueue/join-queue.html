<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QueueSmart - Join Queue</title>

  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="join-queue.css">
  <script src="../auth.js"></script>
  <link rel="stylesheet" href="../Notifications/notifications.css">

  <script src="../Notifications/notifications.js" defer></script>
  
  <script type="module" src="join-page.js"></script>
</head>

<body>
  <header>
    <h1>Queue<span class="smart">Smart</span></h1>

    <nav aria-label="Main navigation">
      <a href="../UserDashboard/dashboard.html">Dashboard</a>
      <a href="join-queue.html" aria-current="page">Join queue</a>
      <a href="../logout.html">Logout</a>
    </nav>
  </header>

  <main class="queue-container">
    <h2>Join the queue</h2>

    <p id="queue-explanation">
      Choose a service to join the shared queue.
      Higher-priority services are served first.
      People with the same priority are served in arrival order.
    </p>

    <form id="join-queue-form">
      <div class="queue-fields">
        <div>
          <label for="service">Select a service (required):</label>

          <select
            id="service"
            name="service"
            class="form-control"
            aria-describedby="queue-explanation"
            required
          >
          <option value="">Choose a service</option>
          <option value="1">Prescription Pickup</option>
            <option value="">Choose a service</option>
            <!-- queue-logic.js adds the saved services here. -->
          </select>
        </div>

        <div class="wait-summary">
          <span>Estimated wait</span>
          <span
            id="estimated-wait"
            aria-live="polite"
            aria-atomic="true"
          >—</span>
        </div>
      </div>

      <div class="queue-actions">
        <button
          type="submit"
          id="join-queue"
          class="btn btn-primary"
        >
          Join queue
        </button>

        <button
          type="button"
          id="leave-queue"
          class="btn btn-secondary"
          disabled
        >
          Leave queue
        </button>
      </div>

      <p id="queue-message" role="status"></p>
    </form>
  </main>
</body>
</html>
