<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QueueSmart - History</title>

  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="history.css">
  <link rel="stylesheet" href="../Notifications/notifications.css">

  <!-- notifications.js must load before any page script that calls showNotification() -->
  <script src="../Notifications/notifications.js" defer></script>
  <script src="history-logic.js" defer></script>
</head>

<body>
  <header class="global-header">
    <h1>Queue<span class="smart">Smart</span></h1>
    <nav class="global-nav">
      <a href="../UserDashboard/dashboard.html">Dashboard</a>
      <a href="../JoinQueue/join-queue.html">Join a queue</a>
      <a href="../QueueSataus/queue-status.html">Queue status</a>
      <a href="history.html">History</a>
    </nav>
  </header>

  <main class="history-container">
    <h2>Your queue history</h2>

    <label for="history-filter">Filter by service:</label>
    <select id="history-filter" class="form-control">
      <option value="all">All services</option>
    </select>

    <ul class="history-list" id="history-list" hidden>
      <!-- JS populates history entries here -->
    </ul>

    <p class="history-empty" id="history-empty" role="status">
      Loading your history…
    </p>
  </main>
</body>
</html>
