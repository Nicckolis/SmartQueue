<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QueueSmart - Dashboard</title>

  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="../Notifications/notifications.css">
  <script src="../auth.js"></script>
  <script src="../Notifications/notifications.js" defer></script>
  <script type="module" src="../JoinQueue/queue-logic.js"></script>
</head>

<body>
  <header>
    <h1>Queue<span class="smart">Smart</span></h1>

    <nav aria-label="Main navigation">
      <a href="dashboard.html" aria-current="page">Dashboard</a>
      <a href="../JoinQueue/join-queue.html">Join queue</a>
      <a href="../logout.html">Logout</a>
    </nav>
  </header>

  <main class="dashboard">
    <h2>User Dashboard</h2>

    <section class="box queue-panel">
      <h3>My queue status</h3>

      <p>
        Selected service:
        <span id="current-service">—</span>
      </p>

      <p>
        Status:
        <span id="current-status">Loading...</span>
      </p>

      <p>
        Position in shared queue:
        <span id="current-position">—</span>
      </p>

      <p>
        Estimated wait:
        <span id="current-wait">—</span>
      </p>
    </section>

    <section class="box queue-panel">
      <h3>Available services</h3>

      <ul id="available-services-list">
        <li>Loading services...</li>
      </ul>

      <a href="../JoinQueue/join-queue.html">Choose a service</a>
    </section>

    <section class="box queue-panel">
      <h3>Recent notifications</h3>

      <ul id="notification-list">
        <li>Loading notifications...</li>
      </ul>
    </section>
  </main>
</body>
</html>
