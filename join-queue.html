<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QueueSmart - Join Queue</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="join-queue.css">
  
  <script src="queue-logic.js" defer></script>
</head>

<body>
  <header>
    <h1>Queue<span class="smart">Smart</span></h1>

    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="join-queue.html">Join a queue</a>
    </nav>
  </header>

  <main class="queue-container">
    <h2>Join a queue</h2>

    <form id="join-queue-form">
      <div class="queue-fields">
        <div>
          <label for="service">Select a service (required):</label>

          <select id="service" name="service" class="form-control" required>
            <option value="">Choose a service</option>
            <option value="service-1">Prescription Pickup</option>
            <option value="service-2">Consultation</option>
          </select>
        </div>

        <div class="wait-summary">
          <span>Estimated wait</span>
          <span id="estimated-wait">-</span>
        </div>
      </div>

      <div class="queue-actions">
        <button type="submit" id="join-queue" class="btn btn-primary">
          Join queue
        </button>

        <button type="button" id="leave-queue" class="btn btn-secondary" disabled>
          Leave queue
        </button>
      </div>

      <p id="queue-message" role="status"></p>
    </form>
  </main>
</body>
</html>
